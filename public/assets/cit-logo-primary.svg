<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="100%" height="100%" fill="none" role="img" aria-label="CIT Smart Scheduler Primary Logo">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="cit-p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101B3C" />
      <stop offset="50%" stop-color="#14264D" />
      <stop offset="100%" stop-color="#0B1329" />
    </linearGradient>

    <linearGradient id="cit-p-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="cit-p-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="cit-p-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <filter id="cit-p-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ================= ICON EMBLEM (Left: 0 - 64) ================= -->
  <g transform="translate(4, 4)">
    <!-- Container -->
    <rect width="56" height="56" rx="14" fill="url(#cit-p-bg)" />
    <rect width="54.4" height="54.4" x="0.8" y="0.8" rx="13.2" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1" />

    <g filter="url(#cit-p-shadow)">
      <!-- Mortarboard Top Diamond -->
      <polygon points="28,7 46,15.5 28,24 10,15.5" fill="url(#cit-p-primary)" />
      <polygon points="28,7 46,15.5 28,17 10,15.5" fill="white" fill-opacity="0.2" />
      <polyline points="10,15.5 28,24 46,15.5" fill="none" stroke="#67E8F9" stroke-width="0.8" />

      <!-- Skullcap Rim -->
      <path d="M 19,20.5 Q 28,25 37,20.5 L 38,23.5 Q 28,28 18,23.5 Z" fill="#1E293B" />

      <!-- Tassel -->
      <circle cx="28" cy="15.5" r="1.2" fill="#38BDF8" />
      <path d="M 28,15.5 Q 40,16 43,21 L 43.5,26.5" fill="none" stroke="#38BDF8" stroke-width="1.1" stroke-linecap="round" />
      <circle cx="43.5" cy="26.5" r="1" fill="#67E8F9" />

      <!-- Open Book Pages -->
      <path d="M 27,27.5 Q 17,25.5 9,28.5 L 9,40 Q 18,37 27,39.5 Z" fill="#F8FAFC" />
      <path d="M 29,27.5 Q 39,25.5 47,28.5 L 47,40 Q 38,37 29,39.5 Z" fill="#F8FAFC" />

      <!-- Schedule Slots -->
      <rect x="12.5" y="30" width="4.8" height="2.6" rx="0.6" fill="#2563EB" fill-opacity="0.8" />
      <rect x="19" y="30" width="4.8" height="2.6" rx="0.6" fill="#06B6D4" />
      <rect x="12.5" y="34.5" width="4.8" height="2.6" rx="0.6" fill="#64748B" fill-opacity="0.6" />
      <rect x="19" y="34.5" width="4.8" height="2.6" rx="0.6" fill="#2563EB" fill-opacity="0.8" />

      <rect x="32" y="30" width="4.8" height="2.6" rx="0.6" fill="#7C3AED" fill-opacity="0.8" />
      <rect x="38.5" y="30" width="4.8" height="2.6" rx="0.6" fill="#2563EB" fill-opacity="0.8" />
      <rect x="32" y="34.5" width="4.8" height="2.6" rx="0.6" fill="#06B6D4" />
      <rect x="38.5" y="34.5" width="4.8" height="2.6" rx="0.6" fill="#64748B" fill-opacity="0.6" />

      <!-- Tech Nodes & Arc -->
      <path d="M 13.5,43 Q 28,46.5 42.5,43" fill="none" stroke="url(#cit-p-cyan)" stroke-width="1.3" stroke-linecap="round" />
      <circle cx="28" cy="45" r="1.3" fill="#67E8F9" />
    </g>
  </g>

  <!-- ================= TYPOGRAPHY & BRANDING (Right: 72 - 320) ================= -->
  <g transform="translate(74, 11)">
    <!-- Brand Title: CIT Smart Scheduler -->
    <text x="0" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="20" letter-spacing="-0.03em" fill="#101B3C">
      <tspan fill="#2563EB">CIT</tspan>
      <tspan fill="#101B3C"> Smart Scheduler</tspan>
    </text>

    <!-- Subtitle: Chilika Institute of Technology -->
    <text x="0" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="10.5" letter-spacing="0.02em" fill="#475569">
      CHILIKA INSTITUTE OF TECHNOLOGY
    </text>

    <!-- Tagline: Plan • Manage • Optimize with gradient highlight -->
    <text x="0" y="47" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', 'Segoe UI', monospace" font-weight="600" font-size="9" letter-spacing="0.08em" fill="#0284C7">
      PLAN • MANAGE • OPTIMIZE
    </text>

    <!-- CP-SAT Engine Pill Badge -->
    <rect x="180" y="6" width="56" height="17" rx="8.5" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
    <text x="208" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="8.5" fill="#1D4ED8" letter-spacing="0.04em">
      CP-SAT
    </text>
  </g>
</svg>

